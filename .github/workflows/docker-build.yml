name: Docker Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Least-privilege default (I9/I10 security-boundaries finding): absent an explicit
# permissions: block, GITHUB_TOKEN inherits whatever the repo-level default is
# rather than this workflow requesting only what it needs. contents: read covers
# the test job below (checkout + build/test only); the docker job overrides this
# with its own job-level permissions block (job-level permissions replace, not add
# to, the workflow-level default for that job only — see the `docker:` job below)
# since it additionally needs to push to GHCR.
permissions:
  contents: read

jobs:
  # Same build/vet/fmt/test/golangci-lint gate as ci.yml, duplicated here (rather
  # than a reusable/shared workflow, matching go-crypto-pool's docker-build.yml
  # convention of gating the docker job on its own full copy of the test job) so
  # this workflow never builds/pushes an image for code that doesn't pass CI.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taripay
          POSTGRES_PASSWORD: taripay
          POSTGRES_DB: taripay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TARIPAY_TEST_POSTGRES_DSN: postgres://taripay:taripay@localhost:5432/taripay_test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6  # v9
        with:
          version: v2.13

      - name: Test
        id: test
        run: go test -p 1 -count=1 -race -v ./...

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            echo "### :white_check_mark: CI passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :x: CI failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  docker:
    needs: test
    runs-on: ubuntu-latest

    # Job-level permissions override (I9/I10 security-boundaries finding): this is
    # the only job in either workflow that logs into GHCR and pushes an image, so
    # it's the only one that needs packages: write. Job-level permissions: blocks
    # REPLACE (not add to) the workflow-level default above for that job only —
    # standard GitHub Actions behavior — so contents: read must be restated here
    # even though it's already the workflow-level default, or this job would only
    # have packages: write and lose the (also-needed) checkout read access.
    permissions:
      contents: read
      packages: write

    # Single-entry matrix: this repo has exactly one binary (cmd/gateway), unlike
    # go-crypto-pool's four. Kept as a matrix (rather than flattened into plain
    # steps) so a second binary can be added later without restructuring the job.
    strategy:
      matrix:
        include:
          - binary: gateway
            dockerfile: docker/gateway/Dockerfile
            # Image name deliberately drops the redundant "-gateway" suffix that
            # go-crypto-pool's multi-binary ghcr.io/snipa22/<repo>-<binary> naming
            # needed to disambiguate between its four binaries — this repo only
            # ever has one, and the repo name (taripay-gateway) already says
            # "gateway", so ghcr.io/snipa22/taripay-gateway-gateway would be a
            # stutter. Revisit this naming if a second binary is ever added.
            image: ghcr.io/snipa22/taripay-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build always runs, on every PR and push, to validate the Dockerfile.
      # Push only happens on a version-tag push (never on a plain main push, and
      # never on a PR) — this mirrors go-crypto-pool's docker-build.yml gating.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# Deliberately omitted, unlike go-crypto-pool's docker-build.yml: release-archive /
# publish-release jobs. Those exist there to cross-compile and publish OS-specific
# CLI archives — taripay-gateway is a long-running daemon service distributed only
# as a container image, so there's nothing for a release-archive job to produce.
# This is a scope decision, not an oversight — flagged here and in the task summary.
